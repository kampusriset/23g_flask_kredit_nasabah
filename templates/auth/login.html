<!doctype html>
<html lang="id" class="h-full bg-slate-50">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SIPINA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: { 500: '#0A192F', 600: '#081426', 900: '#020c1b' },
              gold: { 500: '#d4af37', 600: '#aa8c2c' }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      
      /* Animation Definitions */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(2rem); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-in {
        animation-fill-mode: both;
      }
      .fade-in {
        animation-name: fadeIn;
      }
      .slide-in-from-bottom-8 {
        animation-name: slideInUp;
      }
      .duration-700 {
        animation-duration: 700ms;
      }
    </style>
  </head>
  <body class="h-full overflow-y-auto">
    <div class="min-h-screen flex items-center justify-center relative bg-navy-500 py-12 px-4 sm:px-6 lg:px-8">
      <!-- Abstract Background Elements -->
      <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-gold-500/10 rounded-full blur-3xl mix-blend-screen animate-pulse duration-[5000ms]"></div>
        <div class="absolute -bottom-24 -right-24 w-128 h-128 bg-blue-500/10 rounded-full blur-3xl mix-blend-screen animate-pulse duration-[7000ms]"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-[radial-gradient(circle_at_center,_transparent_0%,_#0A192F_100%)] opacity-80"></div>
      </div>

      <div class="max-w-md w-full space-y-8 relative z-10 animate-in fade-in slide-in-from-bottom-8 duration-700 ease-out">
        <div class="text-center">
          <div class="inline-flex items-center justify-center p-4 bg-gold-500/10 rounded-2xl border border-gold-500/20 mb-6 group hover:scale-105 transition-transform duration-300 shadow-2xl shadow-gold-500/10">
            <i class="bi bi-bank2 text-5xl text-gold-500 drop-shadow-md"></i>
          </div>
          <h1 class="text-4xl font-black text-white tracking-tight">SIPINA</h1>
          <p class="mt-3 text-slate-400 font-medium">Sistem Informasi Pengajuan Kredit Nasabah</p>
        </div>

        <div class="glass-effect p-10 rounded-[2.5rem] shadow-2xl border border-white/10 ring-1 ring-white/50">
          <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="space-y-1">
              <label for="username" class="text-[10px] font-black uppercase tracking-[2px] text-slate-500 ml-1">Username</label>
              <div class="relative group">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-gold-500 transition-colors">
                  <i class="bi bi-person-fill text-lg"></i>
                </span>
                <input type="text" name="username" required 
                       class="block w-full pl-12 pr-4 py-3.5 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-gold-500/20 focus:bg-white transition-all text-slate-800 font-bold placeholder:text-slate-400 placeholder:font-normal text-sm"
                       placeholder="Username anda">
              </div>
            </div>

            <div class="space-y-1">
              <label for="password" class="text-[10px] font-black uppercase tracking-[2px] text-slate-500 ml-1">Password</label>
              <div class="relative group">
                <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 group-focus-within:text-gold-500 transition-colors">
                  <i class="bi bi-shield-lock-fill text-lg"></i>
                </span>
                <input type="password" name="password" required 
                       class="block w-full pl-12 pr-4 py-3.5 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-gold-500/20 focus:bg-white transition-all text-slate-800 font-bold placeholder:text-slate-400 placeholder:font-normal text-sm"
                       placeholder="Password anda">
              </div>
            </div>

            <div class="pt-2">
              <button type="submit" 
                      class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-black rounded-xl text-navy-900 bg-gold-500 hover:bg-gold-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gold-500 transition-all shadow-xl shadow-gold-500/20 hover:shadow-gold-500/40 hover:-translate-y-1 active:translate-y-0 uppercase tracking-widest">
                <span class="absolute left-0 inset-y-0 flex items-center pl-4 text-navy-800 opacity-30 group-hover:opacity-100 transition-opacity">
                  <i class="bi bi-box-arrow-in-right text-lg"></i>
                </span>
                Masuk Sekarang
              </button>
            </div>
          </form>

          <div class="mt-8 pt-6 border-t border-slate-100">
            <div class="flex flex-col items-center gap-4">
              <!-- Demo Account Info -->
              <div class="px-5 py-3 bg-slate-50/50 rounded-xl border border-slate-200 text-center w-full">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5"><i class="bi bi-info-circle-fill mr-1"></i> Demo Access</p>
                <div class="flex items-center justify-center gap-2 text-xs font-bold text-slate-600 font-mono">
                  <span class="bg-white px-2 py-1 rounded border border-slate-100">admin</span>
                  <span class="text-slate-300">|</span>
                  <span class="bg-white px-2 py-1 rounded border border-slate-100">admin123</span>
                </div>
              </div>
              
              <p class="text-sm text-slate-500 font-medium">
                Belum punya akun? <a href="{{ url_for('auth.register') }}" class="font-bold text-navy-600 hover:text-gold-600 transition-colors underline decoration-2 underline-offset-4 decoration-gold-500/30 hover:decoration-gold-500">Daftar Akun Baru</a>
              </p>
            </div>
          </div>
        </div>
        
        <p class="text-center text-slate-400/60 text-[10px] font-medium tracking-wide">
          &copy; 2024 <span class="font-bold text-slate-400">SIPINA</span> Digital Banking Solutions
        </p>
      </div>
    </div>
  </body>
</html>
